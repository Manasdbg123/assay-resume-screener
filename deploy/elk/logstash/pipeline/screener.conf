# Logstash pipeline for resume-screener events.
#
# Filebeat has already parsed the JSON, so there is no grok here. Logstash's job
# is enrichment and routing: derive the fields the dashboards need, and split
# screening events into their own index so retention can differ from app logs.

input {
  beats {
    port => 5044
  }
}

filter {
  # The app emits @timestamp as an ISO-8601 string; make it the event time so
  # Kibana orders by when the request happened, not when the log was ingested.
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Screening events carry a score. Bucket it so a dashboard can chart the
  # distribution of match quality without a scripted field.
  if [overall_score] {
    ruby {
      code => '
        score = event.get("overall_score").to_f
        bucket = case score
                 when 80..100 then "80-100 strong"
                 when 65...80 then "65-79 match"
                 when 45...65 then "45-64 partial"
                 else "0-44 weak"
                 end
        event.set("score_bucket", bucket)
      '
    }
    mutate { add_tag => ["screening"] }
  }

  # Degraded results came from the keyword fallback, not Claude. Tagging them
  # keeps them out of quality dashboards and makes the alert condition trivial.
  if [degraded] == true {
    mutate { add_tag => ["degraded"] }
  }

  if [log][level] in ["ERROR", "CRITICAL"] {
    mutate { add_tag => ["alertable"] }
  }

  # Latency buckets for the SLO panel.
  if [event][duration_ms] {
    ruby {
      code => '
        ms = event.get("[event][duration_ms]").to_i
        event.set("latency_bucket", ms < 1000 ? "fast" : ms < 5000 ? "normal" : ms < 15000 ? "slow" : "very_slow")
      '
    }
  }
}

output {
  if "screening" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "screenings-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "app-logs-%{+YYYY.MM.dd}"
    }
  }

  # Uncomment when debugging the pipeline itself.
  # stdout { codec => rubydebug }
}
