apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resume-screener
  namespace: resume-screener
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resume-screener
  minReplicas: 3
  maxReplicas: 12
  metrics:
    # Requests spend most of their time blocked on the Claude API, so CPU is a
    # poor scaling signal on its own - it stays low while every worker thread is
    # occupied. Memory is the secondary guard; a queue-depth or in-flight-request
    # custom metric would be the right primary signal in a mature deployment.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      # Avoid flapping: screening traffic is bursty.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
